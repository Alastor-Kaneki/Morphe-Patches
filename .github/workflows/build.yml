name: Temporary Relay Crashfix Artifact Cleanup

on:
  pull_request:
    branches: [ main ]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete relay crashfix artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/9523124939"
