name: Temporary MCPE Addon Relay PR Build

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  relay-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract relay source
        run: unzip -q .tmp-relay/relay-source.zip

      - name: Build relay APK
        working-directory: MCPE_Addon_Relay
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload relay APK
        uses: actions/upload-artifact@v4
        with:
          name: MCPE-Addon-Relay-debug
          path: MCPE_Addon_Relay/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
