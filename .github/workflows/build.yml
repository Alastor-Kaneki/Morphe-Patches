name: Temporary Relay Artifact Cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete relay artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/9520003265"
