name: Temporary Relay GitHub Cleanup

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close temp PR and delete temp branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/25" -f state=closed
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/relay-pr-build-20260824"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/mcpe-addon-relay-build-20260824" || true
