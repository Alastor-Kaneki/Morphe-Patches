name: Publish Morphe release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: read

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Test GX URL resolver
        run: bash tools/test-parser.sh

      - name: Build Android Morphe bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --stacktrace

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          TAG="v${VERSION}"
          mapfile -t BUNDLES < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print)
          if (( ${#BUNDLES[@]} == 0 )); then
            echo 'No .mpp bundle was generated.' >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Morphe Patches ${TAG}" \
              --notes "Built Morphe patch bundle for ${TAG}. Includes the Opera GX raw mod downloader patch."
          fi
          gh release upload "$TAG" "${BUNDLES[@]}" --clobber
