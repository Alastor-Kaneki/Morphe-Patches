name: Recover missing v1.15.3 release

on:
  push:
    branches:
      - repair/morphe-release-metadata-1153

permissions:
  contents: write
  packages: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the published v1.15.3 tag, not the repair branch
        uses: actions/checkout@v4
        with:
          ref: v1.15.3
          fetch-depth: 0

      - name: Verify tag and metadata version agree
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^version\s*=\s*1\.15\.3\s*$' gradle.properties
          python3 - <<'PY'
          import json
          from pathlib import Path
          metadata=json.loads(Path('patches-bundle.json').read_text())
          assert metadata['version']=='1.15.3'
          assert metadata['download_url'].endswith('/v1.15.3/patches-1.15.3.mpp')
          print('Source metadata matches tag v1.15.3')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build the missing release asset from its original tag
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --stacktrace

      - name: Publish the missing release asset and verify access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUNDLE="patches/build/libs/patches-1.15.3.mpp"
          test -s "$BUNDLE"
          echo "RECOVERED_MPP_SHA256=$(sha256sum "$BUNDLE" | awk '{print $1}')"
          if gh release view v1.15.3 >/dev/null 2>&1; then
            echo 'Release v1.15.3 exists already; leaving it unchanged.'
          else
            gh release create v1.15.3 "$BUNDLE" \
              --verify-tag --title "v1.15.3" --latest \
              --notes "Recovery of the v1.15.3 patch bundle. The semantic-release job built this version but failed while pushing Git notes before it could create the GitHub Release. Includes the Reddit Share 403 fix from PR #40 and all existing Morphe patches."
          fi
          gh release view v1.15.3 --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name]}'
          gh release download v1.15.3 -p "patches-1.15.3.mpp" -D /tmp/verified-release
          test -s /tmp/verified-release/patches-1.15.3.mpp
          echo "VERIFIED_RELEASE_SHA256=$(sha256sum /tmp/verified-release/patches-1.15.3.mpp | awk '{print $1}')"
