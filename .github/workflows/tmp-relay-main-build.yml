name: Temporary MCPE Addon Relay main build
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-relay-main-build.yml'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reassemble source archive
        run: |
          cat .tmp-relay/source.part* | base64 -d > relay-source.zip
          unzip -q relay-source.zip
      - name: Build debug APK
        id: build
        working-directory: MCPE_Addon_Relay
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > ../build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish build result to main
        shell: bash
        run: |
          rm -f MCPE-Addon-Relay-debug.apk build-failure.log
          if [ "${{ steps.build.outputs.exit_code }}" = "0" ]; then
            cp MCPE_Addon_Relay/app/build/outputs/apk/debug/app-debug.apk MCPE-Addon-Relay-debug.apk
          else
            cp build.log build-failure.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- MCPE-Addon-Relay-debug.apk build-failure.log
          git commit -m "chore(ci): temporary relay build result [skip ci]"
          git push origin HEAD:main
      - name: Purge relay Actions artifacts and temp branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "MCPE-Addon-Relay-debug" or .name == "mcpe-addon-relay-debug") | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            done
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/tmp/mcpe-addon-relay-build-20260824" || true
      - name: Fail job when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
